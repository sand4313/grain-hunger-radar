name: Radar daily run

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (07:17 Kyiv / 09:17 Dubai)
  workflow_dispatch: {}     # "Run workflow" button for manual runs
  push:                     # also run when code changes (not on the bot's own data commits)
    branches: [main]
    paths-ignore: ["data/**", "site/**", "briefs/**", "**.md"]

permissions:
  contents: write   # commit fresh data back to the repo
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Pull data, score, build dashboard and brief
        env:
          HAPI_APP_IDENTIFIER: ${{ secrets.HAPI_APP_IDENTIFIER }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          USDA_FAS_API_KEY: ${{ secrets.USDA_FAS_API_KEY }}
        run: python run.py

      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data briefs site
          git diff --cached --quiet || git commit -m "Radar data $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
